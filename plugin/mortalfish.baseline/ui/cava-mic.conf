; The Deck's equalizer when a Sonos room plays and you've let it listen:
; cava hears the room through the laptop's microphone (the default input,
; filled in when it starts, read straight from PipeWire for the least delay) and
; prints each frame's bar heights, 0-100. Started by Deck.qml only while the
; Deck is on screen, playing in a room, with the microphone turned on there.
[general]
framerate = 60
bars = 28
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = @DEFAULT_SOURCE@

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 25
monstercat = 1
