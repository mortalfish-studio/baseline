; The Deck's equalizer: cava listens to what the laptop plays (PipeWire's
; default output) and prints each frame's bar heights, 0-100, one line per
; frame. Started by Deck.qml only while the Deck is on screen and playing.
[general]
framerate = 30
bars = 28
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
monstercat = 1
