# Baseline's prompt. The install copies this to ~/.config/starship.toml;
# `afterlight prompt` then adds the look's colours as [palettes.baseline].
palette = "baseline"
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[◆](bold alert)"
success_symbol = "[◇](bold accent)"

[directory]
style = "bold accent"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold accent"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic highlight"

[git_status]
format     = '[$all_status]($style)'
style      = "highlight"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
