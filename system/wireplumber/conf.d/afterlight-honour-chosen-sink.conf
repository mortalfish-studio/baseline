# Afterlight 2049: let a chosen output win even if its jack sensor reads empty.
# Script: ~/.local/share/wireplumber/scripts/afterlight/honour-chosen-sink.lua
wireplumber.components = [
  {
    name = afterlight/honour-chosen-sink.lua, type = script/lua
    provides = custom.afterlight-honour-chosen-sink
  }
]

wireplumber.profiles = {
  main = {
    custom.afterlight-honour-chosen-sink = required
  }
}
