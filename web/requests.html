<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Request a song</title>
<style>
  :root { --bg: __BG__; --ink: __INK__; --pink: __ACCENT__; --teal: __CYAN__; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 ui-monospace, "Iosevka", "JetBrains Mono", monospace; }
  body { padding: 20px 16px 40px; max-width: 560px; margin: 0 auto; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--pink), var(--teal)); }
  .kicker { color: var(--pink); letter-spacing: .35em; font-size: 11px; text-transform: uppercase; margin: 6px 0 2px; }
  h1 { margin: 0 0 18px; font-size: 26px; letter-spacing: .08em; color: var(--teal); text-transform: uppercase; }
  .now { display: flex; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-left: 3px solid var(--pink); border-radius: 8px; background: rgba(255,255,255,.03); }
  .now img { width: 64px; height: 64px; border-radius: 4px; object-fit: cover; background: #222; flex: none; }
  .now .label { color: var(--pink); font-size: 11px; letter-spacing: .3em; }
  .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { opacity: .65; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; opacity: .75; }
  .next li { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next li::before { content: "› "; color: var(--teal); }
  form { display: flex; gap: 8px; margin: 22px 0 6px; }
  input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: rgba(255,255,255,.04); border: 1px solid var(--pink); border-radius: 8px; padding: 12px; }
  input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  button { font: inherit; color: var(--pink); background: transparent; border: 1px solid var(--pink); border-radius: 8px; padding: 10px 14px; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; }
  button:active { background: rgba(255,255,255,.08); }
  button[disabled] { opacity: .4; }
  .name { display: flex; align-items: center; gap: 8px; font-size: 13px; opacity: .8; margin-bottom: 14px; }
  .name input { border-color: var(--line); padding: 8px 10px; }
  .hint { opacity: .55; font-size: 13px; margin: 18px 0; text-align: center; }
  .row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row img { width: 52px; height: 52px; border-radius: 4px; object-fit: cover; background: #222; flex: none; }
  .row .text { flex: 1; min-width: 0; }
  .row button { flex: none; }
  .row button.sent { color: var(--teal); border-color: var(--teal); }
  .msg { position: fixed; left: 16px; right: 16px; bottom: 20px; max-width: 528px; margin: 0 auto; padding: 12px 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--teal); color: var(--teal); opacity: 0; transform: translateY(8px); transition: .18s ease-out; pointer-events: none; }
  .msg.on { opacity: 1; transform: none; }
</style>
</head>
<body>
  <div class="kicker">Baseline · Deck</div>
  <h1>Request a song</h1>
  <div class="now" id="now" hidden>
    <img id="nowArt" alt="">
    <div style="min-width:0">
      <div class="label">NOW PLAYING</div>
      <div class="title" id="nowTitle"></div>
      <div class="sub" id="nowArtist"></div>
    </div>
  </div>
  <ul class="next" id="next"></ul>
  <form id="find">
    <input id="q" type="search" placeholder="Search Apple Music" autocomplete="off" maxlength="100" enterkeyhint="search">
    <button>Find</button>
  </form>
  <label class="name">Your name <input id="who" maxlength="30" placeholder="optional"></label>
  <div id="results"><p class="hint">Find a song and press Request. The DJ picks which ones play.</p></div>
  <div class="msg" id="msg"></div>
<script>
  const base = location.pathname.replace(/\/$/, "");
  const $ = (id) => document.getElementById(id);
  const say = (text) => { const m = $("msg"); m.textContent = text; m.classList.add("on"); clearTimeout(say.t); say.t = setTimeout(() => m.classList.remove("on"), 2600); };
  try { $("who").value = localStorage.getItem("who") || ""; } catch (e) {}
  $("who").addEventListener("change", () => { try { localStorage.setItem("who", $("who").value); } catch (e) {} });

  function art(img, url) { if (/^https:\/\//.test(url || "")) img.src = url; else img.removeAttribute("src"); }

  async function now() {
    try {
      const r = await (await fetch(base + "/now")).json();
      $("now").hidden = !r.now;
      if (r.now) { $("nowTitle").textContent = r.now.title; $("nowArtist").textContent = r.now.artist; art($("nowArt"), r.now.thumb); }
      const list = $("next"); list.replaceChildren();
      for (const s of (r.next || [])) { const li = document.createElement("li"); li.textContent = s.title + " · " + s.artist; list.append(li); }
    } catch (e) {}
  }
  now(); setInterval(now, 15000);

  $("find").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (!q) return;
    $("q").blur();
    const box = $("results");
    box.replaceChildren(Object.assign(document.createElement("p"), { className: "hint", textContent: "Looking…" }));
    let r = {};
    try { r = await (await fetch(base + "/search?q=" + encodeURIComponent(q))).json(); } catch (err) {}
    box.replaceChildren();
    if (!(r.songs || []).length) { box.append(Object.assign(document.createElement("p"), { className: "hint", textContent: r.error || "Nothing found. Try the artist and title." })); return; }
    for (const s of r.songs) {
      const row = document.createElement("div"); row.className = "row";
      const img = document.createElement("img"); img.alt = ""; art(img, s.thumb);
      const text = document.createElement("div"); text.className = "text";
      text.append(Object.assign(document.createElement("div"), { className: "title", textContent: s.title }),
                  Object.assign(document.createElement("div"), { className: "sub", textContent: s.artist }));
      const b = document.createElement("button"); b.textContent = "Request";
      b.addEventListener("click", async () => {
        b.disabled = true;
        let a = {};
        try {
          a = await (await fetch(base + "/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                                  body: JSON.stringify({ id: s.id, by: $("who").value.trim().slice(0, 30) }) })).json();
        } catch (err) {}
        if (a.ok) { b.textContent = "Sent"; b.classList.add("sent"); say("Sent! The DJ will see it."); }
        else { b.disabled = false; say(a.error || "Couldn't send that. Try again in a moment."); }
      });
      row.append(img, text, b); box.append(row);
    }
  });
</script>
</body>
</html>
