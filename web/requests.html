<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Request a song</title>
<style>
  :root { --bg: __BG__; --ink: __INK__; --pink: __ACCENT__; --teal: __CYAN__; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 ui-monospace, "Iosevka", "JetBrains Mono", monospace; }
  body { padding: 20px 16px 120px; max-width: 560px; margin: 0 auto; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--pink), var(--teal)); z-index: 5; }
  [hidden] { display: none !important; }
  .kicker { color: var(--pink); letter-spacing: .35em; font-size: 11px; text-transform: uppercase; margin: 6px 0 2px; }
  h1 { margin: 0 0 18px; font-size: 26px; letter-spacing: .08em; color: var(--teal); text-transform: uppercase; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .me { display: flex; align-items: center; gap: 8px; font-size: 13px; background: none; border: 0; color: var(--ink); padding: 4px; text-transform: none; letter-spacing: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink); background: rgba(255,255,255,.06); display: grid; place-items: center; color: var(--pink); font-weight: 700; flex: none; overflow: hidden; }
  .avatar.big { width: 120px; height: 120px; font-size: 44px; }
  .now { display: flex; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-left: 3px solid var(--pink); border-radius: 8px; background: rgba(255,255,255,.03); }
  .now img { width: 64px; height: 64px; border-radius: 4px; object-fit: cover; background: #222; flex: none; }
  .label { color: var(--pink); font-size: 11px; letter-spacing: .3em; }
  .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { opacity: .65; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; opacity: .75; }
  .next li { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next li::before { content: "› "; color: var(--teal); }
  form.find { display: flex; gap: 8px; margin: 22px 0 6px; position: relative; }
  input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: rgba(255,255,255,.04); border: 1px solid var(--pink); border-radius: 8px; padding: 12px; }
  input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  input[type=search]::-webkit-search-cancel-button { display: none; }
  .clear { position: absolute; right: 92px; top: 50%; transform: translateY(-50%); border: 0; color: var(--ink); opacity: .55; padding: 8px; font-size: 18px; letter-spacing: 0; }
  button { font: inherit; color: var(--pink); background: transparent; border: 1px solid var(--pink); border-radius: 8px; padding: 10px 14px; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; }
  button:active { background: rgba(255,255,255,.08); }
  button[disabled] { opacity: .4; }
  button.solid { background: var(--pink); color: var(--bg); font-weight: 700; }
  .hint { opacity: .55; font-size: 13px; margin: 18px 0; text-align: center; }
  .row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row img { width: 52px; height: 52px; border-radius: 4px; object-fit: cover; background: #222; flex: none; }
  .row .text { flex: 1; min-width: 0; }
  .row button { flex: none; min-width: 84px; }
  .row button.on { color: var(--teal); border-color: var(--teal); }
  .tray { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgba(0,0,0,.4); }
  .tray .inner { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .tray .covers { display: flex; flex: 1; min-width: 0; }
  .tray .covers img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; border: 2px solid var(--bg); margin-left: -10px; background: #222; }
  .tray .covers img:first-child { margin-left: 0; }
  .msg { position: fixed; left: 16px; right: 16px; bottom: 90px; max-width: 528px; margin: 0 auto; padding: 12px 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--teal); color: var(--teal); opacity: 0; transform: translateY(8px); transition: .18s ease-out; pointer-events: none; z-index: 6; }
  .msg.on { opacity: 1; transform: none; }
  .hello { text-align: center; padding-top: 30px; }
  .hello h2 { color: var(--teal); letter-spacing: .08em; text-transform: uppercase; font-size: 22px; margin: 0 0 6px; }
  .hello p { opacity: .65; font-size: 14px; margin: 0 0 22px; }
  .hello .pic { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 0 0 22px; }
  .hello input[type=text] { width: 100%; text-align: center; font-size: 18px; margin-bottom: 14px; }
  .hello .go { width: 100%; padding: 14px; }
  .link { background: none; border: 0; color: var(--teal); text-transform: none; letter-spacing: 0; padding: 6px; font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>
  <!-- First time: who are you? (a name, and a selfie if you like) -->
  <section class="hello" id="hello" hidden>
    <div class="kicker">Baseline · Deck</div>
    <h2>Who's asking?</h2>
    <p>Your name goes with your requests, so the DJ knows who picked what.</p>
    <div class="pic">
      <div class="avatar big" id="helloFace">?</div>
      <label><button type="button" id="snap">Add a selfie</button></label>
      <input type="file" id="camera" accept="image/*" capture="user" hidden>
    </div>
    <input type="text" id="helloName" maxlength="30" placeholder="Your name" autocomplete="given-name">
    <button class="solid go" id="helloGo">Let's go</button>
    <button class="link" id="helloBack" hidden>Cancel</button>
  </section>

  <main id="main" hidden>
    <div class="top">
      <div>
        <div class="kicker">Baseline · Deck</div>
        <h1>Request a song</h1>
      </div>
      <button class="me" id="me" title="Change your name or photo"><span id="meName"></span><span class="avatar" id="meFace"></span></button>
    </div>
    <div class="now" id="now" hidden>
      <img id="nowArt" alt="">
      <div style="min-width:0">
        <div class="label">NOW PLAYING</div>
        <div class="title" id="nowTitle"></div>
        <div class="sub" id="nowArtist"></div>
      </div>
    </div>
    <ul class="next" id="next"></ul>
    <form class="find" id="find">
      <input id="q" type="search" placeholder="Search Apple Music" autocomplete="off" maxlength="100" enterkeyhint="search">
      <button type="button" class="clear" id="clear" aria-label="Clear" hidden>✕</button>
      <button>Find</button>
    </form>
    <div id="results"><p class="hint">Find songs and add them (up to 5), then send them all at once. The DJ picks which ones play.</p></div>
  </main>

  <div class="tray" id="tray" hidden>
    <div class="inner">
      <div class="covers" id="trayCovers"></div>
      <button class="link" id="trayClear">Clear</button>
      <button class="solid" id="send">Send</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
<script>
  const base = location.pathname.replace(/\/$/, "");
  const $ = (id) => document.getElementById(id);
  const MAX = 5;
  const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
                  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };
  const say = (text) => { const m = $("msg"); m.textContent = text; m.classList.add("on"); clearTimeout(say.t); say.t = setTimeout(() => m.classList.remove("on"), 2600); };
  const el = (tag, props) => Object.assign(document.createElement(tag), props || {});
  function art(img, url) { if (/^https:\/\//.test(url || "")) img.src = url; else img.removeAttribute("src"); }
  function face(box, photo, name) {
    box.replaceChildren();
    if (/^data:image\/jpeg;base64,/.test(photo || "")) box.append(el("img", { src: photo, alt: "", style: "width:100%;height:100%;object-fit:cover" }));
    else box.textContent = (name || "?").trim().charAt(0).toUpperCase() || "?";
  }

  // ---- who you are: kept on this phone, and remembered by the Deck
  let me = { gid: store.get("gid"), name: store.get("name"), photo: store.get("photo") };
  let shot = "";
  function showMain() {
    $("hello").hidden = true; $("main").hidden = false;
    $("meName").textContent = me.name; face($("meFace"), me.photo, me.name);
    tray();
  }
  function showHello(again) {
    $("main").hidden = true; $("tray").hidden = true; $("hello").hidden = false;
    $("helloName").value = me.name || ""; shot = ""; face($("helloFace"), me.photo, me.name);
    $("helloBack").hidden = !again;
  }
  $("me").addEventListener("click", () => showHello(true));
  $("helloBack").addEventListener("click", showMain);
  $("snap").addEventListener("click", () => $("camera").click());
  $("camera").addEventListener("change", () => {
    const file = $("camera").files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      // A small square, so it's quick to send and kept small.
      const side = Math.min(img.width, img.height), c = el("canvas", { width: 192, height: 192 });
      c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 192, 192);
      shot = c.toDataURL("image/jpeg", 0.8);
      face($("helloFace"), shot, $("helloName").value);
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  });
  $("helloGo").addEventListener("click", async () => {
    const name = $("helloName").value.trim();
    if (!name) { $("helloName").focus(); return; }
    $("helloGo").disabled = true;
    let r = {};
    try {
      r = await (await fetch(base + "/hello", { method: "POST", headers: { "Content-Type": "application/json" },
                                                body: JSON.stringify({ gid: me.gid, name, photo: shot }) })).json();
    } catch (e) {}
    $("helloGo").disabled = false;
    if (!r.ok) { say(r.error || "Couldn't reach the Deck. Try again."); return; }
    me = { gid: r.gid, name: r.name, photo: shot || me.photo };
    store.set("gid", me.gid); store.set("name", me.name); store.set("photo", me.photo);
    showMain();
    say("Hi " + me.name + "!");
  });
  (async () => {
    if (me.gid && me.name) {
      try {
        const r = await (await fetch(base + "/me?gid=" + encodeURIComponent(me.gid))).json();
        if (r.known) { me.name = r.name || me.name; return showMain(); }
      } catch (e) { return showMain(); }
    }
    showHello(false);
  })();

  // ---- what's playing
  async function now() {
    try {
      const r = await (await fetch(base + "/now")).json();
      $("now").hidden = !r.now;
      if (r.now) { $("nowTitle").textContent = r.now.title; $("nowArtist").textContent = r.now.artist; art($("nowArt"), r.now.thumb); }
      const list = $("next"); list.replaceChildren();
      for (const s of (r.next || [])) list.append(el("li", { textContent: s.title + " · " + s.artist }));
    } catch (e) {}
  }
  now(); setInterval(now, 15000);

  // ---- picks: add a few, keep searching, send them together
  let picks = [];
  function tray() {
    $("tray").hidden = !picks.length || !$("hello").hidden;
    const covers = $("trayCovers"); covers.replaceChildren();
    for (const p of picks) { const i = el("img", { alt: "" }); art(i, p.thumb); covers.append(i); }
    $("send").textContent = picks.length > 1 ? "Send " + picks.length : "Send";
    for (const b of document.querySelectorAll(".row button")) {
      const on = picks.some((p) => p.id === b.dataset.id);
      b.classList.toggle("on", on); b.textContent = on ? "Added" : "Add";
    }
  }
  function toggle(song) {
    const at = picks.findIndex((p) => p.id === song.id);
    if (at >= 0) picks.splice(at, 1);
    else if (picks.length >= MAX) return say("That's " + MAX + ": send them, then pick more.");
    else picks.push(song);
    tray();
  }
  $("trayClear").addEventListener("click", () => { picks = []; tray(); });
  $("send").addEventListener("click", async () => {
    $("send").disabled = true;
    let a = {};
    try {
      a = await (await fetch(base + "/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ ids: picks.map((p) => p.id), gid: me.gid, by: me.name }) })).json();
    } catch (e) {}
    $("send").disabled = false;
    if (!a.ok) return say(a.error || "Couldn't send. Try again in a moment.");
    say(a.sent > 1 ? "Sent " + a.sent + "! The DJ will see them." : "Sent! The DJ will see it.");
    picks = []; clearSearch(); tray();
  });

  // ---- search
  function clearSearch() {
    $("q").value = ""; $("clear").hidden = true;
    $("results").replaceChildren(el("p", { className: "hint", textContent: "Find another, or watch the Deck." }));
  }
  $("q").addEventListener("input", () => { $("clear").hidden = !$("q").value; });
  $("clear").addEventListener("click", () => { clearSearch(); $("q").focus(); });
  $("find").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (!q) return;
    $("q").blur();
    const box = $("results");
    box.replaceChildren(el("p", { className: "hint", textContent: "Looking…" }));
    let r = {};
    try { r = await (await fetch(base + "/search?q=" + encodeURIComponent(q))).json(); } catch (err) {}
    box.replaceChildren();
    if (!(r.songs || []).length) { box.append(el("p", { className: "hint", textContent: r.error || "Nothing found. Try the artist and title." })); return; }
    for (const s of r.songs) {
      const row = el("div", { className: "row" });
      const img = el("img", { alt: "" }); art(img, s.thumb);
      const text = el("div", { className: "text" });
      text.append(el("div", { className: "title", textContent: s.title }), el("div", { className: "sub", textContent: s.artist }));
      const b = el("button", { textContent: "Add" }); b.dataset.id = s.id;
      b.addEventListener("click", () => toggle(s));
      row.append(img, text, b); box.append(row);
    }
    tray();
  });
</script>
</body>
</html>
